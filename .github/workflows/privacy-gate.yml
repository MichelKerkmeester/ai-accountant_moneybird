name: privacy-gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Self test the patterns
        run: python3 -I scripts/privacy-gate.py --self-test-patterns
      - name: Check the tracked tree
        run: python3 -I scripts/privacy-gate.py --tree
      - name: Check every commit
        run: python3 -I scripts/privacy-gate.py --history
      - name: Run the gate test suite
        run: bash scripts/privacy-gate-test.sh
